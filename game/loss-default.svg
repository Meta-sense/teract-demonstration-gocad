<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Illustration de consolation">
  <!--
    EPIC 18 Story 18.4 — illustration de consolation de repli.
    Volontairement autonome et sans dépendance : Lottie n'est PAS ajouté au
    projet pour un seul client. Si le JSON arrive, ce sera une story à part.
    L'animation respecte prefers-reduced-motion.
  -->
  <defs>
    <linearGradient id="pw-loss-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <g opacity="0.95">
    <g>
      <path
        d="M52 84c-11 0-20-9-20-20s9-20 20-20c3 0 6 .7 8.6 2C64.4 34.7 74.4 28 86 28c15.5 0 28 12.5 28 28 0 .8 0 1.6-.1 2.4 7 2.3 12.1 8.9 12.1 16.6 0 9.4-7.6 17-17 17H52z"
        fill="url(#pw-loss-cloud)"
      />
      <animateTransform
        attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="4s" repeatCount="indefinite"
      />
    </g>

    <g stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <line x1="60" y1="100" x2="54" y2="120">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0s" repeatCount="indefinite" />
      </line>
      <line x1="82" y1="100" x2="76" y2="126">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.4s" repeatCount="indefinite" />
      </line>
      <line x1="104" y1="100" x2="98" y2="118">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.8s" repeatCount="indefinite" />
      </line>
    </g>
  </g>
</svg>
