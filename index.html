<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A221C">
<title>Le défi du bus</title>
<style>
  :root {
    --menthe: #7DE29F;
    --menthe-fonce: #5BC47D;
    --sauge: #86D7A6;
    --foret: #0A221C;
    --sous-bois: #1F2315;
    --brume: #F7FEF9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--foret);
    background:
      radial-gradient(120% 70% at 50% 110%, rgba(125, 226, 159, .55), transparent 60%),
      radial-gradient(80% 50% at 10% -10%, rgba(134, 215, 166, .45), transparent 60%),
      var(--brume);
    overflow: hidden;
  }
  .feuillage { position: fixed; inset: 0; pointer-events: none; }
  .feuille { position: absolute; transform-origin: 50% 100%; animation: brise 6s ease-in-out infinite alternate; }
  .feuille:nth-child(2) { animation-duration: 7.5s; animation-delay: -2s; }
  .feuille:nth-child(3) { animation-duration: 5.5s; animation-delay: -1s; }
  .feuille:nth-child(4) { animation-duration: 8s; animation-delay: -3s; }
  @keyframes brise { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
  .carte {
    position: relative;
    width: min(100%, 440px);
    padding: 40px 28px 32px;
    border-radius: 28px;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: blur(6px);
    box-shadow: 0 24px 60px -24px rgba(10, 34, 28, .35);
    text-align: center;
  }
  .logo { width: 160px; height: auto; display: block; margin: 0 auto 28px; }
  .puce {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--foret);
    color: var(--menthe);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1 { margin-top: 18px; font-size: clamp(34px, 9vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: var(--menthe-fonce); }
  p { margin-top: 14px; font-size: 17px; line-height: 1.5; color: #24423A; }
  .date { margin-top: 26px; font-weight: 700; font-size: 18px; }
  .defis { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .defis li {
    list-style: none;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(125, 226, 159, .25);
    font-size: 14px;
    font-weight: 600;
  }
  .defis { padding: 0; }
  @media (prefers-reduced-motion: reduce) { .feuille { animation: none; } }
</style>
</head>
<body>
  <div class="feuillage" aria-hidden="true">
    <svg class="feuille" style="left:-40px; bottom:-30px; width:220px" viewBox="0 0 200 260"><path d="M100 260C40 200 10 140 30 70 50 20 90 0 100 0c10 0 50 20 70 70 20 70-10 130-70 190Z" fill="#7DE29F" opacity=".75"/><path d="M100 255V20" stroke="#5BC47D" stroke-width="5" fill="none"/></svg>
    <svg class="feuille" style="right:-30px; bottom:-20px; width:180px" viewBox="0 0 200 260"><path d="M100 260C40 200 10 140 30 70 50 20 90 0 100 0c10 0 50 20 70 70 20 70-10 130-70 190Z" fill="#86D7A6" opacity=".8"/><path d="M100 255V20" stroke="#5BC47D" stroke-width="5" fill="none"/></svg>
    <svg class="feuille" style="right:12%; top:-60px; width:120px; transform-origin:50% 0" viewBox="0 0 200 260"><path d="M100 260C40 200 10 140 30 70 50 20 90 0 100 0c10 0 50 20 70 70 20 70-10 130-70 190Z" fill="#7DE29F" opacity=".45"/></svg>
    <svg class="feuille" style="left:8%; top:-40px; width:90px; transform-origin:50% 0" viewBox="0 0 200 260"><path d="M100 260C40 200 10 140 30 70 50 20 90 0 100 0c10 0 50 20 70 70 20 70-10 130-70 190Z" fill="#86D7A6" opacity=".5"/></svg>
  </div>
  <main class="carte">
    <img class="logo" src="logo.png" alt="Teract" width="300" height="88">
    <span class="puce">Bus tour · retour</span>
    <h1>Le défi <span>du bus</span></h1>
    <p>Quatre défis vous attendent sur le trajet du retour.</p>
    <ul class="defis">
      <li>Quiz</li>
      <li>Carte à gratter</li>
      <li>Saute-Étages</li>
      <li>Prix flash</li>
    </ul>
    <p class="date">Rendez-vous jeudi 12 novembre</p>
  </main>
</body>
</html>
